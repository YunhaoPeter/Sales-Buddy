name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main, develop, 'codex/**', 'feature/**', 'fix/**', 'docs/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run security:check -- --tracked
      - run: npm run test:ci
      - run: npm run build
